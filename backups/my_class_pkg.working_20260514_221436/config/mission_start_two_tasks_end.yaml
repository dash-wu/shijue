# ---------------------------------------------------------------------------
# 期末综合实战航点配置（6 个点版本）。
#
# 顺序：起点 → TASK1（房间1识别） → TASK2 → TASK3 → TASK4 → TASK5
#       → END（终点）
#
# 第三项是 yaw（度）。
# 推荐用一键采样脚本：
#   rosrun my_class_pkg sample_waypoints_enter.py
#   按一次 Enter 记录一个点（顺序 TASK1→…→END）
#
# tag_check_at 列出的航点会在到位后短时订阅 /tag_detections，按 1 号码识别
# 后向 /talk 发"已找到目标"或"未找到目标"。
# ---------------------------------------------------------------------------

map_frame: map

# 第一个航点就是 TASK1（车从起点直接发 TASK1 的 goal）
skip_first_waypoint: false

# 单点最长等待（DWA 走不到该时间内放弃）
goal_timeout_sec: 60.0

# 单点最多重试次数（每次重试前自动清代价图）
point_retries: 1

# 容差自检：超时但车已离目标 ≤ arrive_tolerance_m 时，按到达处理（避免在窄道反复磨）
arrive_tolerance_m: 0.70

# 每个点开始前自动清一次代价图，减少残留膨胀挡路
clear_costmaps_before_each: true

# TF 帧（与 navigation 配置保持一致）
base_frame: base_footprint

# AprilTag（房间1 / 房间2 两个识别点；按需调整哪个 TASK 是识别点）
tag_check_at: [TASK1, TASK3]
tag_target_id: 1
tag_scan_duration_sec: 1.0
tag_detections_topic: /tag_detections

# TTS
tts_talk_topic: /talk
tts_hit: "已找到目标"
tts_miss: "未找到目标"
tts_nonblocking: true
tts_pause_sec: 0.4

# ---------------------------------------------------------------------------
# 航点坐标（占位，**必须按现场重新标定**，或用 sample_waypoints_enter.py 自动写）
# ---------------------------------------------------------------------------
waypoints:
  TASK1: [2.623, -1.363, -75.83]
  TASK2: [2.071, -0.398, 178.28]
  MID:   [1.952, -4.269, -15.82]
  TASK3: [2.587, -3.399, 86.09]
  TASK4: [1.976, -4.214, 163.60]
  TASK5: [0.560, -2.973, 165.83]
  END: [-0.471, -2.528, 173.68]

visit_order: [TASK1, TASK2, MID, TASK3, TASK4, TASK5, END]
