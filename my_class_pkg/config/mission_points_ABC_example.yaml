# ---------------------------------------------------------------------------
# 固定出发区（每场不变）
# - 车体每次停放在同一实物「起点」区域；导航前在 RViz 用「2D Pose Estimate」做一次初定位。
# - 通常不需要再给「导航系统发一个移动到起点」的目标——车在起点就位即可直接从 A/B/C 开始。
#
# A / B / C：本场固定的三个任务点（map 坐标 [x,y,yaw_deg]，与 ros_pub_goal / arena_mission 一致）
# - 场地与地图不换时下面数字可沿用；换了地图或场地则需重新标点。
# - 标点步骤：bringup + navigation + 初定位 → teleop 到点停稳 →
#     bash /home/bcsh/upros_class_code/scripts/tutorial_read_pose_map.sh
#
# （可选）若在「空地校准点」须先自动走一脚，可自拟名字如 START，并写 visit_order: [START,A,B,C]
# ---------------------------------------------------------------------------

waypoints:
  A: [0.05, -0.05, 0.0]
  B: [1.0, 0.0, 0.0]
  C: [-0.5, 0.5, 90.0]

visit_order: [A, B, C]

goal_timeout_sec: 90.0
